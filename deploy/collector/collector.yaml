apiVersion: v1
kind: ServiceAccount
metadata:
  name: zoomlens-collector
  namespace: zoomlens
  labels:
    app.kubernetes.io/name: zoomlens-collector
    app.kubernetes.io/part-of: zoomlens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zoomlens-collector
  labels:
    app.kubernetes.io/part-of: zoomlens
rules:
  # Kubernetes service discovery.
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # Kubelet /metrics and /metrics/cadvisor.
  - apiGroups: [""]
    resources: [nodes/metrics, nodes/proxy, nodes/stats]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zoomlens-collector
  labels:
    app.kubernetes.io/part-of: zoomlens
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zoomlens-collector
subjects:
  - kind: ServiceAccount
    name: zoomlens-collector
    namespace: zoomlens
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zoomlens-collector
  namespace: zoomlens
  labels:
    app.kubernetes.io/name: zoomlens-collector
    app.kubernetes.io/part-of: zoomlens
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zoomlens-collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoomlens-collector
        app.kubernetes.io/part-of: zoomlens
      annotations:
        # Changes when the baseline config changes, so pods restart.
        zoomlens.dev/config-hash: CONFIG_HASH_PLACEHOLDER
    spec:
      serviceAccountName: zoomlens-collector
      # Run on every node, including control-plane nodes.
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: zoomlens-collector:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/zoomlens/supervisor.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOMEMLIMIT
              value: 400MiB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/zoomlens
              readOnly: true
            - name: supervisor-data
              mountPath: /var/lib/otelcol/supervisor
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: config
          configMap:
            name: zoomlens-collector
        - name: supervisor-data
          emptyDir: {}
        - name: hostfs
          hostPath:
            path: /
