apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zoomlens
resources:
  - collector.yaml
configMapGenerator:
  - name: zoomlens-collector
    files:
      - supervisor.yaml
      - base-config.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: zoomlens
