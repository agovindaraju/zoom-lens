# Scenario A: CPU noisy neighbour on the demo app's node, no CPU limit.
# Start/stop with: scripts/scenario.sh cpu start|stop
apiVersion: batch/v1
kind: Job
metadata:
  name: noisy-cpu
  namespace: zoomlens-demo
  labels:
    app.kubernetes.io/name: noisy-cpu
    app.kubernetes.io/part-of: zoomlens
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noisy-cpu
        app.kubernetes.io/part-of: zoomlens
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: demo-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stress
          image: zoomlens-demo-app:dev
          imagePullPolicy: IfNotPresent
          args: ["-mode=stress-cpu", "-workers=4", "-duration=25m"]
          # Deliberately no CPU limit: this is the misconfiguration to find.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
