apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: zoomlens-dashboard
    files:
      - zoomlens-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    # Picked up by the kube-prometheus-stack Grafana dashboard sidecar.
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: zoomlens
