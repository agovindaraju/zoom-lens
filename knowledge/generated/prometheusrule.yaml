# GENERATED by `go run ./tools/knowledge-gen prometheusrule` from knowledge/rules/*.rules.yml. Do not edit.
# For clusters that use the Prometheus Operator; plain Prometheus loads knowledge/rules/ directly.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/part-of: zoomlens
  name: zoomlens-roots
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: zoomlens.cadvisor
    rules:
    - alert: ZLContainerCPUNearLimit
      annotations:
        description: 'Source: USE utilisation vs CPU limit.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          uses {{ $value | humanizePercentage }} of its CPU limit'
      expr: (sum by (node, namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
        / sum by (node, namespace, pod, container) (container_spec_cpu_quota{container!="",image!=""}
        / container_spec_cpu_period{container!="",image!=""})) > 0.9
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: container_cpu_usage_seconds_total
        zoomlens_source: cadvisor
    - alert: ZLCPUThrottlingHigh
      annotations:
        description: 'Source: kubernetes-mixin CPUThrottlingHigh.'
        summary: '{{ $value | humanizePercentage }} of CFS periods throttled for {{
          $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}'
      expr: (sum by (node, namespace, pod, container) (increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m]))
        / sum by (node, namespace, pod, container) (increase(container_cpu_cfs_periods_total{container!=""}[5m])))
        > 0.25
      for: 15m
      labels:
        severity: info
        zoomlens_entity: Pod
        zoomlens_root: container_cpu_cfs_throttled_periods_total
        zoomlens_source: cadvisor
    - alert: ZLContainerMemoryNearLimit
      annotations:
        description: 'Source: USE saturation vs memory limit.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          working set is {{ $value | humanizePercentage }} of its limit'
      expr: (max by (node, namespace, pod, container) (container_memory_working_set_bytes{container!="",image!=""}
        / (container_spec_memory_limit_bytes{container!="",image!=""} > 0))) > 0.9
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: container_memory_working_set_bytes
        zoomlens_source: cadvisor
    - alert: ZLContainerOOMEvents
      annotations:
        description: 'Source: USE errors.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          hit OOM'
      expr: (sum by (node, namespace, pod, container) (increase(container_oom_events_total{container!=""}[10m])))
        > 0
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: container_oom_events_total
        zoomlens_source: cadvisor
    - alert: ZLContainerHeavyDiskWrites
      annotations:
        description: 'Source: USE utilisation (tune per cluster).'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} writes {{ $value | humanize1024
          }}B/s'
      expr: (sum by (node, namespace, pod) (rate(container_fs_writes_bytes_total{container!=""}[5m])))
        > 52428800
      for: 10m
      labels:
        severity: info
        zoomlens_entity: Pod
        zoomlens_root: container_fs_writes_bytes_total
        zoomlens_source: cadvisor
    - alert: ZLPodNetworkDrops
      annotations:
        description: 'Source: USE errors.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} drops {{ $value }} packets/s'
      expr: (sum by (node, namespace, pod) (rate(container_network_receive_packets_dropped_total[5m])
        + rate(container_network_transmit_packets_dropped_total[5m]))) > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: container_network_receive_packets_dropped_total
        zoomlens_source: cadvisor
  - interval: 30s
    name: zoomlens.calico
    rules:
    - alert: ZLCalicoDataplaneFailures
      annotations:
        description: 'Source: RED errors.'
        summary: Calico dataplane updates fail on {{ $labels.node }}
      expr: (sum by (node) (rate(felix_int_dataplane_failures[5m]))) > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: felix_int_dataplane_failures
        zoomlens_source: calico
    - alert: ZLCalicoNotInSync
      annotations:
        description: 'Source: operational (3 = in sync).'
        summary: Calico Felix on {{ $labels.node }} is not in sync with the datastore
      expr: (max by (node) (felix_resync_state)) != 3
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: felix_resync_state
        zoomlens_source: calico
  - interval: 30s
    name: zoomlens.cilium
    rules:
    - alert: ZLCiliumDrops
      annotations:
        description: 'Source: USE errors (tune).'
        summary: Cilium on {{ $labels.node }} drops {{ $value }} pkt/s ({{ $labels.reason
          }})
      expr: (sum by (node, reason) (rate(cilium_drop_count_total[5m]))) > 10
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: cilium_drop_count_total
        zoomlens_source: cilium
    - alert: ZLCiliumBPFMapPressure
      annotations:
        description: 'Source: USE saturation.'
        summary: BPF map {{ $labels.map_name }} on {{ $labels.node }} is {{ $value
          | humanizePercentage }} full
      expr: (max by (node, map_name) (cilium_bpf_map_pressure)) > 0.9
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: cilium_bpf_map_pressure
        zoomlens_source: cilium
    - alert: ZLCiliumUnreachableNodes
      annotations:
        description: 'Source: operational.'
        summary: '{{ $labels.node }} cannot reach {{ $value }} nodes'
      expr: (max by (node) (cilium_unreachable_nodes)) > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: cilium_unreachable_nodes
        zoomlens_source: cilium
    - alert: ZLCiliumEndpointRegenerationFailures
      annotations:
        description: 'Source: RED errors.'
        summary: endpoint regeneration fails on {{ $labels.node }}
      expr: (sum by (node) (rate(cilium_endpoint_regenerations_total{outcome="fail"}[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: cilium_endpoint_regenerations_total
        zoomlens_source: cilium
  - interval: 30s
    name: zoomlens.containerd
    rules:
    - alert: ZLContainerdPodNetworkSetupSlow
      annotations:
        description: 'Source: operational (metric name UNVERIFIED).'
        summary: pod network setup p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(containerd_cri_sandbox_create_network_seconds_bucket[5m]))))
        > 10
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: containerd_cri_sandbox_create_network_seconds
        zoomlens_source: containerd
  - interval: 30s
    name: zoomlens.coredns
    rules:
    - alert: ZLCoreDNSLatencyHigh
      annotations:
        description: 'Source: coredns-mixin CoreDNSLatencyHigh (mixin critical = 4s;
          lower here to zoom in earlier).'
        summary: CoreDNS {{ $labels.pod }} p99 for {{ $labels.zone }} is {{ $value
          }}s
      expr: (histogram_quantile(0.99, sum by (namespace, pod, server, zone, le) (rate(coredns_dns_request_duration_seconds_bucket[5m]))))
        > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: coredns_dns_request_duration_seconds
        zoomlens_source: coredns
    - alert: ZLCoreDNSErrorsHigh
      annotations:
        description: 'Source: coredns-mixin CoreDNSErrorsHigh (warning).'
        summary: CoreDNS {{ $labels.pod }} returns {{ $value | humanizePercentage
          }} SERVFAIL
      expr: (sum by (namespace, pod) (rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m]))
        / sum by (namespace, pod) (rate(coredns_dns_responses_total[5m]))) > 0.01
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: coredns_dns_responses_total
        zoomlens_source: coredns
    - alert: ZLCoreDNSForwardHealthcheckBroken
      annotations:
        description: 'Source: coredns-mixin CoreDNSForwardHealthcheckBrokenCount.'
        summary: all upstreams of CoreDNS {{ $labels.pod }} are unhealthy
      expr: (sum by (namespace, pod) (rate(coredns_forward_healthcheck_broken_total[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: coredns_forward_healthcheck_broken_total
        zoomlens_source: coredns
    - alert: ZLCoreDNSOverloaded
      annotations:
        description: 'Source: health plugin overload signal.'
        summary: CoreDNS {{ $labels.pod }} self-health p99 is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (namespace, pod, le) (rate(coredns_health_request_duration_seconds_bucket[5m]))))
        > 1
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: coredns_health_request_duration_seconds
        zoomlens_source: coredns
    - alert: ZLCoreDNSPanics
      annotations:
        description: 'Source: RED errors.'
        summary: CoreDNS {{ $labels.pod }} panicked
      expr: (sum by (namespace, pod) (increase(coredns_panics_total[10m]))) > 0
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: coredns_panics_total
        zoomlens_source: coredns
  - interval: 30s
    name: zoomlens.csi
    rules:
    - alert: ZLCSIOperationErrors
      annotations:
        description: 'Source: RED errors.'
        summary: CSI {{ $labels.method_name }} fails for {{ $labels.driver_name }}
      expr: (sum by (driver_name, method_name) (rate(csi_sidecar_operations_seconds_count{grpc_status_code!="OK"}[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: CSIDriver
        zoomlens_root: csi_sidecar_operations_seconds
        zoomlens_source: csi
  - interval: 30s
    name: zoomlens.etcd
    rules:
    - alert: ZLEtcdNoLeader
      annotations:
        description: 'Source: etcd-mixin etcdNoLeader.'
        summary: etcd member on {{ $labels.node }} has no leader
      expr: (min by (node) (etcd_server_has_leader)) == 0
      for: 1m
      labels:
        severity: critical
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_server_has_leader
        zoomlens_source: etcd
    - alert: ZLEtcdHighNumberOfLeaderChanges
      annotations:
        description: 'Source: etcd-mixin etcdHighNumberOfLeaderChanges.'
        summary: '{{ $value }} etcd leader changes in 15m'
      expr: (max by (node) (increase(etcd_server_leader_changes_seen_total[15m])))
        >= 4
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_server_leader_changes_seen_total
        zoomlens_source: etcd
    - alert: ZLEtcdHighNumberOfFailedProposals
      annotations:
        description: 'Source: etcd-mixin etcdHighNumberOfFailedProposals.'
        summary: etcd on {{ $labels.node }} fails {{ $value }} proposals/s
      expr: (max by (node) (rate(etcd_server_proposals_failed_total[15m]))) > 5
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_server_proposals_failed_total
        zoomlens_source: etcd
    - alert: ZLEtcdHighFsyncDurations
      annotations:
        description: 'Source: etcd-mixin etcdHighFsyncDurations.'
        summary: etcd WAL fsync p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))))
        > 0.5
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_disk_wal_fsync_duration_seconds
        zoomlens_source: etcd
    - alert: ZLEtcdHighCommitDurations
      annotations:
        description: 'Source: etcd-mixin etcdHighCommitDurations.'
        summary: etcd backend commit p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))))
        > 0.25
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_disk_backend_commit_duration_seconds
        zoomlens_source: etcd
    - alert: ZLEtcdMemberCommunicationSlow
      annotations:
        description: 'Source: etcd-mixin etcdMemberCommunicationSlow.'
        summary: etcd peer RTT p99 to {{ $labels.To }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, To, le) (rate(etcd_network_peer_round_trip_time_seconds_bucket[5m]))))
        > 0.15
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_network_peer_round_trip_time_seconds
        zoomlens_source: etcd
    - alert: ZLEtcdDatabaseQuotaLowSpace
      annotations:
        description: 'Source: etcd-mixin etcdDatabaseQuotaLowSpace.'
        summary: etcd DB on {{ $labels.node }} is {{ $value | humanizePercentage }}
          of quota
      expr: (max by (node) (etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes))
        > 0.95
      for: 10m
      labels:
        severity: critical
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_mvcc_db_total_size_in_bytes
        zoomlens_source: etcd
    - alert: ZLEtcdDatabaseHighFragmentationRatio
      annotations:
        description: 'Source: etcd-mixin etcdDatabaseHighFragmentationRatio.'
        summary: etcd DB on {{ $labels.node }} is only {{ $value | humanizePercentage
          }} in use (defragment)
      expr: (max by (node) ((etcd_mvcc_db_total_size_in_use_in_bytes / etcd_mvcc_db_total_size_in_bytes)
        and etcd_mvcc_db_total_size_in_use_in_bytes > 104857600)) < 0.5
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: etcd_mvcc_db_total_size_in_bytes
        zoomlens_source: etcd
    - alert: ZLEtcdHighNumberOfFailedGRPCRequests
      annotations:
        description: 'Source: etcd-mixin etcdHighNumberOfFailedGRPCRequests.'
        summary: '{{ $value | humanizePercentage }} of {{ $labels.grpc_method }} fail
          on {{ $labels.node }}'
      expr: (sum by (node, grpc_service, grpc_method) (rate(grpc_server_handled_total{grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m]))
        / sum by (node, grpc_service, grpc_method) (rate(grpc_server_handled_total[5m])))
        > 0.01
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: EtcdMember
        zoomlens_root: grpc_server_handled_total
        zoomlens_source: etcd
  - interval: 30s
    name: zoomlens.kube-apiserver
    rules:
    - alert: ZLKubeAPIErrorsHigh
      annotations:
        description: 'Source: kubernetes-mixin KubeAPIErrorBudgetBurn (simplified
          to a ratio).'
        summary: apiserver on {{ $labels.node }} returns {{ $value | humanizePercentage
          }} 5xx
      expr: (sum by (node) (rate(apiserver_request_total{code=~"5.."}[5m])) / sum
        by (node) (rate(apiserver_request_total[5m]))) > 0.05
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_request_total
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAPILatencyHigh
      annotations:
        description: 'Source: SLO: non-streaming request latency.'
        summary: apiserver {{ $labels.verb }} p99 on {{ $labels.node }} is {{ $value
          }}s
      expr: (histogram_quantile(0.99, sum by (node, verb, le) (rate(apiserver_request_sli_duration_seconds_bucket{verb!~"WATCH|WATCHLIST|CONNECT"}[5m]))))
        > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_request_sli_duration_seconds
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAPIPriorityAndFairnessRejecting
      annotations:
        description: 'Source: APF saturation.'
        summary: APF rejects requests at priority level {{ $labels.priority_level
          }} on {{ $labels.node }}
      expr: (sum by (node, priority_level) (rate(apiserver_flowcontrol_rejected_requests_total[5m])))
        > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_flowcontrol_rejected_requests_total
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAPIInflightHigh
      annotations:
        description: 'Source: saturation (80% of the default --max-requests-inflight=400;
          tune).'
        summary: '{{ $value }} inflight {{ $labels.request_kind }} requests on {{
          $labels.node }}'
      expr: (max by (node, request_kind) (apiserver_current_inflight_requests)) >
        320
      for: 5m
      labels:
        severity: info
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_current_inflight_requests
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAPIEtcdLatencyHigh
      annotations:
        description: 'Source: storage latency seen by the apiserver.'
        summary: etcd {{ $labels.operation }} p99 from {{ $labels.node }} is {{ $value
          }}s
      expr: (histogram_quantile(0.99, sum by (node, operation, le) (rate(etcd_request_duration_seconds_bucket[5m]))))
        > 0.5
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: etcd_request_duration_seconds
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAdmissionWebhookSlow
      annotations:
        description: 'Source: operational.'
        summary: admission webhook {{ $labels.name }} p99 is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, name, le) (rate(apiserver_admission_webhook_admission_duration_seconds_bucket[5m]))))
        > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_admission_webhook_admission_duration_seconds
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAggregatedAPIDown
      annotations:
        description: 'Source: kubernetes-mixin KubeAggregatedAPIDown.'
        summary: APIService {{ $labels.name }} is unavailable
      expr: (max by (name) (aggregator_unavailable_apiservice)) == 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: aggregator_unavailable_apiservice
        zoomlens_source: kube-apiserver
    - alert: ZLKubeClientCertificateExpiration
      annotations:
        description: 'Source: kubernetes-mixin KubeClientCertificateExpiration.'
        summary: a client certificate used against {{ $labels.node }} expires in {{
          $value | humanizeDuration }}
      expr: (histogram_quantile(0.01, sum by (node, le) (rate(apiserver_client_certificate_expiration_seconds_bucket[5m]))))
        < 604800
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: APIServer
        zoomlens_root: apiserver_client_certificate_expiration_seconds
        zoomlens_source: kube-apiserver
    - alert: ZLKubeAPIServerHealthcheckFailing
      annotations:
        description: 'Source: component /readyz check.'
        summary: apiserver readyz check {{ $labels.name }} fails on {{ $labels.node
          }}
      expr: (min by (node, name) (kubernetes_healthcheck{type="readyz"})) == 0
      for: 5m
      labels:
        severity: critical
        zoomlens_entity: APIServer
        zoomlens_root: kubernetes_healthcheck
        zoomlens_source: kube-apiserver
  - interval: 30s
    name: zoomlens.kube-controller-manager
    rules:
    - alert: ZLControllerWorkqueueBacklog
      annotations:
        description: 'Source: saturation (tune).'
        summary: workqueue {{ $labels.name }} has {{ $value }} items
      expr: (max by (node, name) (workqueue_depth)) > 100
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: workqueue_depth
        zoomlens_source: kube-controller-manager
    - alert: ZLUnhealthyNodesInZone
      annotations:
        description: 'Source: operational.'
        summary: '{{ $value }} unhealthy nodes in zone {{ $labels.zone }}'
      expr: (max by (zone) (node_collector_unhealthy_nodes_in_zone)) > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: node_collector_unhealthy_nodes_in_zone
        zoomlens_source: kube-controller-manager
    - alert: ZLNodeControllerEvicting
      annotations:
        description: 'Source: operational.'
        summary: node controller evicted in zone {{ $labels.zone }}
      expr: (sum by (zone) (increase(node_collector_evictions_total[15m]))) > 0
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: node_collector_evictions_total
        zoomlens_source: kube-controller-manager
    - alert: ZLVolumeOperationErrors
      annotations:
        description: 'Source: RED errors.'
        summary: '{{ $labels.operation_name }} fails for {{ $labels.plugin_name }}'
      expr: (sum by (operation_name, plugin_name) (rate(volume_operation_errors_total[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: volume_operation_errors_total
        zoomlens_source: kube-controller-manager
    - alert: ZLControllerManagerNoLeader
      annotations:
        description: 'Source: operational.'
        summary: no kube-controller-manager instance holds the leader lease
      expr: (sum(leader_election_master_status{name="kube-controller-manager"})) ==
        0
      for: 5m
      labels:
        severity: critical
        zoomlens_entity: ControllerManager
        zoomlens_root: leader_election_master_status
        zoomlens_source: kube-controller-manager
    - alert: ZLControllerManagerHealthcheckFailing
      annotations:
        description: 'Source: component health check.'
        summary: controller-manager check {{ $labels.name }} fails on {{ $labels.node
          }}
      expr: (min by (node, name) (kubernetes_healthcheck)) == 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: kubernetes_healthcheck
        zoomlens_source: kube-controller-manager
    - alert: ZLControllerManagerClientErrors
      annotations:
        description: 'Source: kubernetes-mixin KubeClientErrors.'
        summary: controller-manager sees {{ $value | humanizePercentage }} API errors
      expr: (sum by (node) (rate(rest_client_requests_total{code=~"5.."}[5m])) / sum
        by (node) (rate(rest_client_requests_total[5m]))) > 0.01
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: ControllerManager
        zoomlens_root: rest_client_requests_total
        zoomlens_source: kube-controller-manager
  - interval: 30s
    name: zoomlens.kube-proxy
    rules:
    - alert: ZLKubeProxySyncSlow
      annotations:
        description: 'Source: operational.'
        summary: kube-proxy rule sync p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(kubeproxy_sync_proxy_rules_duration_seconds_bucket[5m]))))
        > 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_sync_proxy_rules_duration_seconds
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyNetworkProgrammingSlow
      annotations:
        description: 'Source: Kubernetes SLO: in-cluster network programming latency
          p99 <= 30s.'
        summary: network programming p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(kubeproxy_network_programming_duration_seconds_bucket[5m]))))
        > 30
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_network_programming_duration_seconds
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyRulesStale
      annotations:
        description: 'Source: kube-proxy healthz logic.'
        summary: kube-proxy on {{ $labels.node }} has a queued sync pending for {{
          $value }}s
      expr: (max by (node) (kubeproxy_sync_proxy_rules_last_queued_timestamp_seconds
        - kubeproxy_sync_proxy_rules_last_timestamp_seconds)) > 60
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_sync_proxy_rules_last_timestamp_seconds
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyIptablesRestoreFailures
      annotations:
        description: 'Source: RED errors.'
        summary: iptables-restore fails on {{ $labels.node }}
      expr: (sum by (node) (rate(kubeproxy_sync_proxy_rules_iptables_restore_failures_total[5m])))
        > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_sync_proxy_rules_iptables_restore_failures_total
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyNftablesSyncFailures
      annotations:
        description: 'Source: RED errors.'
        summary: nftables sync fails on {{ $labels.node }}
      expr: (sum by (node) (rate(kubeproxy_sync_proxy_rules_nftables_sync_failures_total[5m])))
        > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_sync_proxy_rules_nftables_sync_failures_total
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyUnhealthy
      annotations:
        description: 'Source: component health check.'
        summary: kube-proxy healthz fails on {{ $labels.node }}
      expr: (sum by (node) (rate(kubeproxy_proxy_healthz_total{code!="200"}[5m])))
        > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubeproxy_proxy_healthz_total
        zoomlens_source: kube-proxy
    - alert: ZLKubeProxyClientErrors
      annotations:
        description: 'Source: kubernetes-mixin KubeClientErrors.'
        summary: kube-proxy on {{ $labels.node }} sees {{ $value | humanizePercentage
          }} API errors
      expr: (sum by (node) (rate(rest_client_requests_total{code=~"5.."}[5m])) / sum
        by (node) (rate(rest_client_requests_total[5m]))) > 0.01
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: rest_client_requests_total
        zoomlens_source: kube-proxy
  - interval: 30s
    name: zoomlens.kube-scheduler
    rules:
    - alert: ZLSchedulerUnschedulablePods
      annotations:
        description: 'Source: operational.'
        summary: '{{ $value }} pods unschedulable'
      expr: (sum by (node) (scheduler_pending_pods{queue="unschedulable"})) > 0
      for: 30m
      labels:
        severity: warning
        zoomlens_entity: Scheduler
        zoomlens_root: scheduler_pending_pods
        zoomlens_source: kube-scheduler
    - alert: ZLSchedulerErrors
      annotations:
        description: 'Source: RED errors.'
        summary: scheduler on {{ $labels.node }} returns errors
      expr: (sum by (node) (rate(scheduler_schedule_attempts_total{result="error"}[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Scheduler
        zoomlens_root: scheduler_schedule_attempts_total
        zoomlens_source: kube-scheduler
    - alert: ZLSchedulerLatencyHigh
      annotations:
        description: 'Source: SLI (tune).'
        summary: pod scheduling p99 is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(scheduler_pod_scheduling_sli_duration_seconds_bucket[5m]))))
        > 30
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Scheduler
        zoomlens_root: scheduler_pod_scheduling_sli_duration_seconds
        zoomlens_source: kube-scheduler
    - alert: ZLSchedulerNoLeader
      annotations:
        description: 'Source: operational.'
        summary: no kube-scheduler instance holds the leader lease
      expr: (sum(leader_election_master_status{name="kube-scheduler"})) == 0
      for: 5m
      labels:
        severity: critical
        zoomlens_entity: Scheduler
        zoomlens_root: leader_election_master_status
        zoomlens_source: kube-scheduler
    - alert: ZLSchedulerHealthcheckFailing
      annotations:
        description: 'Source: component health check.'
        summary: scheduler check {{ $labels.name }} fails on {{ $labels.node }}
      expr: (min by (node, name) (kubernetes_healthcheck)) == 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Scheduler
        zoomlens_root: kubernetes_healthcheck
        zoomlens_source: kube-scheduler
    - alert: ZLSchedulerClientErrors
      annotations:
        description: 'Source: kubernetes-mixin KubeClientErrors.'
        summary: scheduler sees {{ $value | humanizePercentage }} API errors
      expr: (sum by (node) (rate(rest_client_requests_total{code=~"5.."}[5m])) / sum
        by (node) (rate(rest_client_requests_total[5m]))) > 0.01
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Scheduler
        zoomlens_root: rest_client_requests_total
        zoomlens_source: kube-scheduler
  - interval: 30s
    name: zoomlens.kube-state-metrics
    rules:
    - alert: ZLKubeCPUOvercommit
      annotations:
        description: 'Source: kubernetes-mixin KubeCPUOvercommit (non-HA form).'
        summary: CPU requests are {{ $value | humanizePercentage }} of allocatable
      expr: (sum(kube_pod_container_resource_requests{resource="cpu"} * on (namespace,
        pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"}
        == 1)) / sum(kube_node_status_allocatable{resource="cpu"})) > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Cluster
        zoomlens_root: kube_node_status_allocatable
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeMemoryOvercommit
      annotations:
        description: 'Source: kubernetes-mixin KubeMemoryOvercommit (non-HA form).'
        summary: Memory requests are {{ $value | humanizePercentage }} of allocatable
      expr: (sum(kube_pod_container_resource_requests{resource="memory"} * on (namespace,
        pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"}
        == 1)) / sum(kube_node_status_allocatable{resource="memory"})) > 1
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Cluster
        zoomlens_root: kube_node_status_allocatable
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeNodeNotReady
      annotations:
        description: 'Source: kubernetes-mixin KubeNodeNotReady (value 0 = not Ready
          and not cordoned).'
        summary: '{{ $labels.node }} is not Ready'
      expr: (min by (node) (kube_node_status_condition{condition="Ready",status="true"}
        + on (node) kube_node_spec_unschedulable)) == 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kube_node_status_condition
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeNodePressure
      annotations:
        description: 'Source: kubernetes-mixin KubeNodePressure.'
        summary: '{{ $labels.node }} has {{ $labels.condition }}'
      expr: (max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"}))
        == 1
      for: 10m
      labels:
        severity: info
        zoomlens_entity: Node
        zoomlens_root: kube_node_status_condition
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeNodeReadinessFlapping
      annotations:
        description: 'Source: kubernetes-mixin KubeNodeReadinessFlapping.'
        summary: '{{ $labels.node }} readiness changed {{ $value }} times in 15m'
      expr: (sum by (node) (changes(kube_node_status_condition{condition="Ready",status="true"}[15m])))
        > 2
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kube_node_status_condition
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeNodeUnreachable
      annotations:
        description: 'Source: kubernetes-mixin KubeNodeUnreachable.'
        summary: '{{ $labels.node }} is unreachable'
      expr: (max by (node) (kube_node_spec_taint{key="node.kubernetes.io/unreachable",effect="NoSchedule"}))
        == 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kube_node_spec_taint
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeQuotaAlmostFull
      annotations:
        description: 'Source: kubernetes-mixin KubeQuotaAlmostFull.'
        summary: '{{ $labels.namespace }} uses {{ $value | humanizePercentage }} of
          quota {{ $labels.resource }}'
      expr: (max by (namespace, resourcequota, resource) (kube_resourcequota{type="used"}
        / on (namespace, resourcequota, resource) (kube_resourcequota{type="hard"}
        > 0))) > 0.9
      for: 15m
      labels:
        severity: info
        zoomlens_entity: Namespace
        zoomlens_root: kube_resourcequota
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeNamespaceStuckTerminating
      annotations:
        description: 'Source: operational.'
        summary: namespace {{ $labels.namespace }} stuck Terminating
      expr: (max by (namespace) (kube_namespace_status_phase{phase="Terminating"}))
        == 1
      for: 1h
      labels:
        severity: warning
        zoomlens_entity: Namespace
        zoomlens_root: kube_namespace_status_phase
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePodNotRunning
      annotations:
        description: 'Source: kubernetes-mixin KubePodNotReady (phase part).'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} is not running'
      expr: (max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}))
        == 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: kube_pod_status_phase
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePodNotReady
      annotations:
        description: 'Source: kubernetes-mixin KubePodNotReady (ready part; 1 = Running
          but not Ready).'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} is running but not ready'
      expr: (max by (namespace, pod) (kube_pod_status_phase{phase="Running"}) - min
        by (namespace, pod) (kube_pod_status_ready{condition="true"})) == 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: kube_pod_status_ready
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePodRestarting
      annotations:
        description: 'Source: operational.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          restarted {{ $value }} times in 15m'
      expr: (max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m])))
        > 2
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: kube_pod_container_status_restarts_total
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePodCrashLooping
      annotations:
        description: 'Source: kubernetes-mixin KubePodCrashLooping.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          is in CrashLoopBackOff'
      expr: (max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m])))
        >= 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: kube_pod_container_status_waiting_reason
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeContainerWaiting
      annotations:
        description: 'Source: kubernetes-mixin KubeContainerWaiting.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}
          waiting: {{ $labels.reason }}'
      expr: (max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"}))
        > 0
      for: 1h
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: kube_pod_container_status_waiting_reason
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeDeploymentReplicasMismatch
      annotations:
        description: 'Source: kubernetes-mixin KubeDeploymentReplicasMismatch (without
          the changes() guard).'
        summary: '{{ $labels.namespace }}/{{ $labels.deployment }} is missing {{ $value
          }} replicas'
      expr: (max by (namespace, deployment) (kube_deployment_spec_replicas - kube_deployment_status_replicas_available))
        > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Deployment
        zoomlens_root: kube_deployment_status_replicas_available
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeReplicaSetReplicasMismatch
      annotations:
        description: 'Source: operational.'
        summary: '{{ $labels.namespace }}/{{ $labels.replicaset }} is missing {{ $value
          }} ready replicas'
      expr: (max by (namespace, replicaset) (kube_replicaset_spec_replicas - kube_replicaset_status_ready_replicas))
        > 0
      for: 15m
      labels:
        severity: info
        zoomlens_entity: ReplicaSet
        zoomlens_root: kube_replicaset_status_ready_replicas
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeStatefulSetReplicasMismatch
      annotations:
        description: 'Source: kubernetes-mixin KubeStatefulSetReplicasMismatch (without
          the changes() guard).'
        summary: '{{ $labels.namespace }}/{{ $labels.statefulset }} is missing {{
          $value }} ready replicas'
      expr: (max by (namespace, statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready))
        > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: StatefulSet
        zoomlens_root: kube_statefulset_status_replicas_ready
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeDaemonSetNotAvailable
      annotations:
        description: 'Source: kubernetes-mixin KubeDaemonSetRolloutStuck (availability
          part).'
        summary: '{{ $labels.namespace }}/{{ $labels.daemonset }} is unavailable on
          {{ $value }} nodes'
      expr: (max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled
        - kube_daemonset_status_number_available)) > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: DaemonSet
        zoomlens_root: kube_daemonset_status_number_available
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeReplicationControllerMismatch
      annotations:
        description: 'Source: operational.'
        summary: '{{ $labels.namespace }}/{{ $labels.replicationcontroller }} is missing
          {{ $value }} replicas'
      expr: (max by (namespace, replicationcontroller) (kube_replicationcontroller_spec_replicas
        - kube_replicationcontroller_status_available_replicas)) > 0
      for: 15m
      labels:
        severity: info
        zoomlens_entity: ReplicationController
        zoomlens_root: kube_replicationcontroller_status_available_replicas
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeJobFailed
      annotations:
        description: 'Source: kubernetes-mixin KubeJobFailed.'
        summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
      expr: (max by (namespace, job_name) (kube_job_failed{condition="true"})) ==
        1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Job
        zoomlens_root: kube_job_failed
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeJobNotCompleted
      annotations:
        description: 'Source: kubernetes-mixin KubeJobNotCompleted (kubeJobTimeoutDuration
          12h).'
        summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} running for {{
          $value | humanizeDuration }}
      expr: (time() - max by (namespace, job_name) (kube_job_status_start_time and
        on (namespace, job_name) kube_job_status_active > 0)) > 43200
      labels:
        severity: warning
        zoomlens_entity: Job
        zoomlens_root: kube_job_status_active
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeCronJobFailing
      annotations:
        description: 'Source: operational (tune to the schedule period).'
        summary: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded
          since {{ $value | humanizeDuration }} before its last run
      expr: (max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time -
        kube_cronjob_status_last_successful_time)) > 3600
      for: 1h
      labels:
        severity: warning
        zoomlens_entity: CronJob
        zoomlens_root: kube_cronjob_status_last_successful_time
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeHpaMaxedOut
      annotations:
        description: 'Source: kubernetes-mixin KubeHpaMaxedOut.'
        summary: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}
          is at max replicas
      expr: (max by (namespace, horizontalpodautoscaler) ((kube_horizontalpodautoscaler_status_current_replicas
        == kube_horizontalpodautoscaler_spec_max_replicas) and on (namespace, horizontalpodautoscaler)
        (kube_horizontalpodautoscaler_spec_max_replicas != kube_horizontalpodautoscaler_spec_min_replicas)))
        > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: HorizontalPodAutoscaler
        zoomlens_root: kube_horizontalpodautoscaler_status_current_replicas
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeHpaReplicasMismatch
      annotations:
        description: 'Source: kubernetes-mixin KubeHpaReplicasMismatch (simplified).'
        summary: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}
          desired != current
      expr: (max by (namespace, horizontalpodautoscaler) (abs(kube_horizontalpodautoscaler_status_desired_replicas
        - kube_horizontalpodautoscaler_status_current_replicas))) > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: HorizontalPodAutoscaler
        zoomlens_root: kube_horizontalpodautoscaler_status_current_replicas
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePdbNotEnoughHealthyPods
      annotations:
        description: 'Source: kubernetes-mixin KubePdbNotEnoughHealthyPods.'
        summary: PDB {{ $labels.namespace }}/{{ $labels.poddisruptionbudget }} lacks
          {{ $value }} healthy pods
      expr: (max by (namespace, poddisruptionbudget) ((kube_poddisruptionbudget_status_desired_healthy
        - kube_poddisruptionbudget_status_current_healthy) and on (namespace, poddisruptionbudget)
        kube_poddisruptionbudget_status_expected_pods > 0)) > 0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: PodDisruptionBudget
        zoomlens_root: kube_poddisruptionbudget_status_current_healthy
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePersistentVolumeClaimNotBound
      annotations:
        description: 'Source: operational.'
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
          not bound
      expr: (max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"}))
        == 1
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: PersistentVolumeClaim
        zoomlens_root: kube_persistentvolumeclaim_status_phase
        zoomlens_source: kube-state-metrics
    - alert: ZLKubePersistentVolumeErrors
      annotations:
        description: 'Source: kubernetes-mixin KubePersistentVolumeErrors.'
        summary: PV {{ $labels.persistentvolume }} is {{ $labels.phase }}
      expr: (max by (persistentvolume) (kube_persistentvolume_status_phase{phase=~"Failed|Pending"}))
        == 1
      for: 5m
      labels:
        severity: critical
        zoomlens_entity: PersistentVolume
        zoomlens_root: kube_persistentvolume_status_phase
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeVolumeNotAttached
      annotations:
        description: 'Source: operational.'
        summary: VolumeAttachment {{ $labels.volumeattachment }} is not attached
      expr: (min by (volumeattachment) (kube_volumeattachment_status_attached)) ==
        0
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: VolumeAttachment
        zoomlens_root: kube_volumeattachment_status_attached
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeEndpointsNotReady
      annotations:
        description: 'Source: operational (fires only when at least one endpoint is
          not ready).'
        summary: '{{ $value | humanizePercentage }} of endpoints in {{ $labels.namespace
          }}/{{ $labels.endpointslice }} are not ready'
      expr: (count by (namespace, endpointslice) (kube_endpointslice_endpoints{ready="false"})
        / count by (namespace, endpointslice) (kube_endpointslice_endpoints)) > 0.5
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Service
        zoomlens_root: kube_endpointslice_endpoints
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeLeaseNotRenewed
      annotations:
        description: 'Source: operational (node heartbeat: kube-node-lease).'
        summary: Lease {{ $labels.namespace }}/{{ $labels.lease }} not renewed for
          {{ $value | humanizeDuration }}
      expr: (time() - max by (namespace, lease) (kube_lease_renew_time)) > 60
      for: 2m
      labels:
        severity: warning
        zoomlens_entity: Lease
        zoomlens_root: kube_lease_renew_time
        zoomlens_source: kube-state-metrics
    - alert: ZLKubeCSRDeniedOrFailed
      annotations:
        description: 'Source: operational.'
        summary: CSR {{ $labels.certificatesigningrequest }} was denied or failed
      expr: (max by (certificatesigningrequest, signer_name) (kube_certificatesigningrequest_condition{condition=~"denied|failed"}))
        == 1
      for: 5m
      labels:
        severity: info
        zoomlens_entity: CertificateSigningRequest
        zoomlens_root: kube_certificatesigningrequest_condition
        zoomlens_source: kube-state-metrics
  - interval: 30s
    name: zoomlens.kubelet
    rules:
    - alert: ZLKubeletPlegDurationHigh
      annotations:
        description: 'Source: kubernetes-mixin KubeletPlegDurationHigh.'
        summary: PLEG relist p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(kubelet_pleg_relist_duration_seconds_bucket[5m]))))
        >= 10
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubelet_pleg_relist_duration_seconds
        zoomlens_source: kubelet
    - alert: ZLKubeletRuntimeErrors
      annotations:
        description: 'Source: RED errors.'
        summary: '{{ $value | humanizePercentage }} of runtime operations fail on
          {{ $labels.node }}'
      expr: (sum by (node) (rate(kubelet_runtime_operations_errors_total[5m])) / sum
        by (node) (rate(kubelet_runtime_operations_total[5m]))) > 0.05
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubelet_runtime_operations_errors_total
        zoomlens_source: kubelet
    - alert: ZLKubeletPodStartUpLatencyHigh
      annotations:
        description: 'Source: kubernetes-mixin KubeletPodStartUpLatencyHigh (mixin
          uses pod_worker_duration).'
        summary: Pod start p99 on {{ $labels.node }} is {{ $value }}s
      expr: (histogram_quantile(0.99, sum by (node, le) (rate(kubelet_pod_start_sli_duration_seconds_bucket[5m]))))
        > 60
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubelet_pod_start_sli_duration_seconds
        zoomlens_source: kubelet
    - alert: ZLKubeNodeEviction
      annotations:
        description: 'Source: kubernetes-mixin KubeNodeEviction.'
        summary: '{{ $labels.node }} evicted pods on {{ $labels.eviction_signal }}'
      expr: (sum by (node, eviction_signal) (increase(kubelet_evictions[15m]))) >
        0
      labels:
        severity: info
        zoomlens_entity: Node
        zoomlens_root: kubelet_evictions
        zoomlens_source: kubelet
    - alert: ZLKubeletTooManyPods
      annotations:
        description: 'Source: kubernetes-mixin KubeletTooManyPods.'
        summary: '{{ $labels.node }} runs {{ $value | humanizePercentage }} of its
          pod capacity'
      expr: (max by (node) (kubelet_running_pods) / on (node) max by (node) (kube_node_status_capacity{resource="pods"}))
        > 0.95
      for: 15m
      labels:
        severity: info
        zoomlens_entity: Node
        zoomlens_root: kubelet_running_pods
        zoomlens_source: kubelet
    - alert: ZLKubeletClientCertificateExpiration
      annotations:
        description: 'Source: kubernetes-mixin KubeletClientCertificateExpiration.'
        summary: kubelet client certificate on {{ $labels.node }} expires in {{ $value
          | humanizeDuration }}
      expr: (min by (node) (kubelet_certificate_manager_client_ttl_seconds)) < 604800
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: kubelet_certificate_manager_client_ttl_seconds
        zoomlens_source: kubelet
    - alert: ZLKubeletNodeMemoryNearCapacity
      annotations:
        description: 'Source: eviction early-warning.'
        summary: '{{ $labels.node }} working set is {{ $value | humanizePercentage
          }} of memory capacity'
      expr: (max by (node) (node_memory_working_set_bytes) / on (node) max by (node)
        (kube_node_status_capacity{resource="memory"})) > 0.9
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_memory_working_set_bytes
        zoomlens_source: kubelet
    - alert: ZLKubeletStorageOperationErrors
      annotations:
        description: 'Source: RED errors.'
        summary: '{{ $labels.operation_name }} fails for {{ $labels.volume_plugin
          }} on {{ $labels.node }}'
      expr: (sum by (node, operation_name, volume_plugin) (rate(storage_operation_duration_seconds_count{status!="success"}[5m])))
        > 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: storage_operation_duration_seconds
        zoomlens_source: kubelet
    - alert: ZLKubeletClientErrors
      annotations:
        description: 'Source: kubernetes-mixin KubeClientErrors.'
        summary: kubelet on {{ $labels.node }} sees {{ $value | humanizePercentage
          }} API errors
      expr: (sum by (node) (rate(rest_client_requests_total{code=~"5.."}[5m])) / sum
        by (node) (rate(rest_client_requests_total[5m]))) > 0.01
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: rest_client_requests_total
        zoomlens_source: kubelet
    - alert: ZLPodProbeFailures
      annotations:
        description: 'Source: RED errors.'
        summary: '{{ $labels.probe_type }} probe of {{ $labels.namespace }}/{{ $labels.pod
          }}/{{ $labels.container }} fails'
      expr: (sum by (node, namespace, pod, container, probe_type) (rate(prober_probe_total{result="failed"}[5m])))
        > 0
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Pod
        zoomlens_root: prober_probe_total
        zoomlens_source: kubelet
    - alert: ZLKubePersistentVolumeFillingUp
      annotations:
        description: 'Source: kubernetes-mixin KubePersistentVolumeFillingUp (critical).'
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has
          {{ $value | humanizePercentage }} space left
      expr: (min by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes
        / kubelet_volume_stats_capacity_bytes)) < 0.03
      for: 1m
      labels:
        severity: critical
        zoomlens_entity: PersistentVolumeClaim
        zoomlens_root: kubelet_volume_stats_available_bytes
        zoomlens_source: kubelet
    - alert: ZLKubePersistentVolumeInodesFillingUp
      annotations:
        description: 'Source: kubernetes-mixin KubePersistentVolumeInodesFillingUp
          (critical).'
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has
          {{ $value | humanizePercentage }} inodes left
      expr: (min by (namespace, persistentvolumeclaim) (kubelet_volume_stats_inodes_free
        / kubelet_volume_stats_inodes)) < 0.03
      for: 1m
      labels:
        severity: critical
        zoomlens_entity: PersistentVolumeClaim
        zoomlens_root: kubelet_volume_stats_inodes_free
        zoomlens_source: kubelet
  - interval: 30s
    name: zoomlens.node-exporter
    rules:
    - alert: ZLNodeCPUHighUsage
      annotations:
        description: 'Source: node-mixin NodeCPUHighUsage.'
        summary: CPU on {{ $labels.node }} is {{ $value | humanizePercentage }} busy
      expr: (1 - avg by (node) (rate(node_cpu_seconds_total{mode=~"idle|iowait"}[5m])))
        > 0.9
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_cpu_seconds_total
        zoomlens_source: node-exporter
    - alert: ZLNodeSystemSaturation
      annotations:
        description: 'Source: node-mixin NodeSystemSaturation.'
        summary: Load per core on {{ $labels.node }} is {{ $value }}
      expr: (max by (node) (node_load1) / count by (node) (node_cpu_seconds_total{mode="idle"}))
        > 2
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_load1
        zoomlens_source: node-exporter
    - alert: ZLNodeMemoryHighUtilization
      annotations:
        description: 'Source: node-mixin NodeMemoryHighUtilization.'
        summary: Memory on {{ $labels.node }} is {{ $value | humanizePercentage }}
          used
      expr: (1 - (max by (node) (node_memory_MemAvailable_bytes) / max by (node) (node_memory_MemTotal_bytes)))
        > 0.9
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_memory_MemAvailable_bytes
        zoomlens_source: node-exporter
    - alert: ZLNodeDiskBusy
      annotations:
        description: 'Source: USE utilisation (node-mixin uses io_time_weighted >
          10 for 30m).'
        summary: Disk {{ $labels.device }} on {{ $labels.node }} is busy {{ $value
          | humanizePercentage }} of the time
      expr: (max by (node, device) (rate(node_disk_io_time_seconds_total[5m]))) >
        0.9
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_disk_io_time_seconds_total
        zoomlens_source: node-exporter
    - alert: ZLNodeFilesystemAlmostOutOfSpace
      annotations:
        description: 'Source: node-mixin NodeFilesystemAlmostOutOfSpace.'
        summary: '{{ $labels.mountpoint }} on {{ $labels.node }} has {{ $value | humanizePercentage
          }} space left'
      expr: (min by (node, device, mountpoint) (node_filesystem_avail_bytes{fstype!=""}
        / node_filesystem_size_bytes{fstype!=""} and node_filesystem_readonly{fstype!=""}
        == 0)) < 0.05
      for: 30m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_filesystem_avail_bytes
        zoomlens_source: node-exporter
    - alert: ZLNodeFilesystemAlmostOutOfFiles
      annotations:
        description: 'Source: node-mixin NodeFilesystemAlmostOutOfFiles.'
        summary: '{{ $labels.mountpoint }} on {{ $labels.node }} has {{ $value | humanizePercentage
          }} inodes left'
      expr: (min by (node, device, mountpoint) (node_filesystem_files_free{fstype!=""}
        / node_filesystem_files{fstype!=""})) < 0.05
      for: 1h
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_filesystem_files_free
        zoomlens_source: node-exporter
    - alert: ZLNodeNetworkSaturated
      annotations:
        description: 'Source: USE utilisation.'
        summary: '{{ $labels.device }} on {{ $labels.node }} receives at {{ $value
          | humanizePercentage }} of link speed'
      expr: (max by (node, device) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|cali.*|cilium.*|lxc.*|flannel.*|cni.*|docker.*|br-.*|vxlan.*|tunl.*|genev.*"}[5m])
        / (node_network_speed_bytes > 0))) > 0.9
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_network_receive_bytes_total
        zoomlens_source: node-exporter
    - alert: ZLNodeNetworkReceiveErrs
      annotations:
        description: 'Source: node-mixin NodeNetworkReceiveErrs (mixin for: 1h).'
        summary: '{{ $labels.device }} on {{ $labels.node }} has {{ $value | humanizePercentage
          }} receive errors'
      expr: (max by (node, device) (rate(node_network_receive_errs_total[5m]) / rate(node_network_receive_packets_total[5m])))
        > 0.01
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_network_receive_errs_total
        zoomlens_source: node-exporter
    - alert: ZLNodeHighNumberConntrackEntriesUsed
      annotations:
        description: 'Source: node-mixin NodeHighNumberConntrackEntriesUsed.'
        summary: conntrack table on {{ $labels.node }} is {{ $value | humanizePercentage
          }} full
      expr: (max by (node) (node_nf_conntrack_entries / node_nf_conntrack_entries_limit))
        > 0.75
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_nf_conntrack_entries
        zoomlens_source: node-exporter
    - alert: ZLNodeFileDescriptorLimit
      annotations:
        description: 'Source: node-mixin NodeFileDescriptorLimit.'
        summary: '{{ $labels.node }} uses {{ $value | humanizePercentage }} of file
          descriptors'
      expr: (max by (node) (node_filefd_allocated / node_filefd_maximum)) > 0.7
      for: 15m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_filefd_allocated
        zoomlens_source: node-exporter
    - alert: ZLNodeClockSkewDetected
      annotations:
        description: 'Source: node-mixin NodeClockSkewDetected.'
        summary: Clock on {{ $labels.node }} is off by {{ $value }}s
      expr: (max by (node) (abs(node_timex_offset_seconds))) > 0.05
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_timex_offset_seconds
        zoomlens_source: node-exporter
    - alert: ZLNodeClockNotSynchronising
      annotations:
        description: 'Source: node-mixin NodeClockNotSynchronising.'
        summary: Clock on {{ $labels.node }} is not synchronising
      expr: (min by (node) (min_over_time(node_timex_sync_status[5m]))) == 0
      for: 10m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_timex_offset_seconds
        zoomlens_source: node-exporter
    - alert: ZLNodeExporterCollectorFailed
      annotations:
        description: 'Source: exporter self-health.'
        summary: node_exporter collector {{ $labels.collector }} fails on {{ $labels.node
          }}
      expr: (min by (node, collector) (node_scrape_collector_success)) == 0
      for: 15m
      labels:
        severity: info
        zoomlens_entity: Node
        zoomlens_root: node_scrape_collector_success
        zoomlens_source: node-exporter
    - alert: ZLNodeSystemdServiceFailed
      annotations:
        description: 'Source: node-mixin NodeSystemdServiceFailed.'
        summary: systemd unit {{ $labels.name }} failed on {{ $labels.node }}
      expr: (max by (node, name) (node_systemd_unit_state{state="failed"})) == 1
      for: 5m
      labels:
        severity: warning
        zoomlens_entity: Node
        zoomlens_root: node_systemd_unit_state
        zoomlens_source: node-exporter
