# Zoom-Lens metric tree packs. Validate with: go run ./tools/knowledge-gen validate knowledge
# Apply with:  kubectl apply -f deploy/crds/ && kubectl apply -k knowledge/
---
apiVersion: zoomlens.dev/v1alpha1
kind: MetricTreePack
metadata:
  name: cadvisor-container
  labels:
    app.kubernetes.io/part-of: zoomlens
    app.kubernetes.io/version: "1.0.0"
    zoomlens.dev/source: cadvisor
spec:
  source:
    name: cadvisor
    component: "google/cadvisor (embedded in kubelet)"
    job: cadvisor
    endpoint: "kubelet :10250/metrics/cadvisor"
    scope: per-node
  entity: Container
  identityLabels: [namespace, pod, container]
  roots:
    - name: container_cpu_usage_seconds_total
      domain: cpu
      companions: [container_spec_cpu_quota, container_spec_cpu_period]
    - name: container_cpu_cfs_throttled_periods_total
      domain: cpu
      companions: [container_cpu_cfs_periods_total]
    - name: container_memory_working_set_bytes
      domain: memory
      companions: [container_spec_memory_limit_bytes]
    - name: container_oom_events_total
      domain: memory
    - name: container_fs_writes_bytes_total
      domain: storage
  children:
    container_cpu_usage_seconds_total:
      - container_cpu_user_seconds_total
      - container_cpu_system_seconds_total
      - container_pressure_cpu_waiting_seconds_total
      - container_spec_cpu_shares
      - container_processes
      - container_cpu_schedstat_runqueue_seconds_total
      - container_cpu_load_average_10s
    container_pressure_cpu_waiting_seconds_total: [container_pressure_cpu_stalled_seconds_total]
    container_processes:
      - container_threads
      - container_threads_max
      - container_file_descriptors
      - container_sockets
      - container_ulimits_soft
    container_cpu_schedstat_runqueue_seconds_total:
      - container_cpu_schedstat_run_seconds_total
      - container_cpu_schedstat_run_periods_total
    container_cpu_load_average_10s: [container_tasks_state, container_cpu_load_d_average_10s]
    container_cpu_cfs_throttled_periods_total:
      - container_cpu_cfs_throttled_seconds_total
      - container_cpu_cfs_burst_periods_total
    container_cpu_cfs_burst_periods_total: [container_cpu_cfs_burst_seconds_total]
    container_memory_working_set_bytes:
      - container_memory_rss
      - container_memory_cache
      - container_memory_usage_bytes
      - container_memory_swap
      - container_memory_mapped_file
      - container_memory_kernel_usage
      - container_pressure_memory_waiting_seconds_total
      - container_memory_events_high_total
      - container_memory_failures_total
    container_memory_cache:
      - container_memory_total_active_file_bytes
      - container_memory_total_inactive_file_bytes
      - container_memory_file_dirty_bytes
      - container_memory_file_writeback_bytes
    container_memory_usage_bytes:
      - container_spec_memory_reservation_limit_bytes
      - container_memory_max_usage_bytes
    container_memory_swap: [container_spec_memory_swap_limit_bytes]
    container_pressure_memory_waiting_seconds_total: [container_pressure_memory_stalled_seconds_total]
    container_memory_events_high_total: [container_memory_failcnt]
    container_memory_failures_total:
      - container_memory_pgscan_total
      - container_memory_pgsteal_total
      - container_memory_workingset_refault_file_total
      - container_memory_workingset_refault_anon_total
    container_oom_events_total:
      - container_memory_events_max_total
      - container_start_time_seconds
      - container_last_seen
    container_fs_writes_bytes_total:
      - container_fs_reads_bytes_total
      - container_fs_writes_total
      - container_fs_reads_total
      - container_pressure_io_waiting_seconds_total
      - container_fs_io_current
      - container_fs_usage_bytes
      - container_blkio_device_usage_total
    container_fs_writes_total:
      - container_fs_write_seconds_total
      - container_fs_writes_merged_total
      - container_fs_sector_writes_total
    container_fs_reads_total:
      - container_fs_read_seconds_total
      - container_fs_reads_merged_total
      - container_fs_sector_reads_total
    container_pressure_io_waiting_seconds_total:
      - container_pressure_io_stalled_seconds_total
      - container_fs_io_cost_wait_seconds_total
    container_fs_io_cost_wait_seconds_total:
      - container_fs_io_cost_usage_seconds_total
      - container_fs_io_cost_indebt_seconds_total
      - container_fs_io_cost_indelay_seconds_total
    container_fs_io_current:
      - container_fs_io_time_seconds_total
      - container_fs_io_time_weighted_seconds_total
    container_fs_usage_bytes:
      - container_fs_limit_bytes
      - container_fs_inodes_free
      - container_fs_inodes_total
  description: "Filter container!=\"\" and image!=\"\" to skip pod/sandbox cgroups. container_pressure_* needs the KubeletPSI gate (default on from 1.34). container_cpu_schedstat_*, container_cpu_load_*, container_tasks_state, container_network_tcp*/udp* are NOT served by the kubelet; they only appear with a standalone cAdvisor DaemonSet."
---
apiVersion: zoomlens.dev/v1alpha1
kind: MetricTreePack
metadata:
  name: cadvisor-pod
  labels:
    app.kubernetes.io/part-of: zoomlens
    app.kubernetes.io/version: "1.0.0"
    zoomlens.dev/source: cadvisor
spec:
  source:
    name: cadvisor
    component: "google/cadvisor (embedded in kubelet)"
    job: cadvisor
    endpoint: "kubelet :10250/metrics/cadvisor"
    scope: per-node
  entity: Pod
  identityLabels: [namespace, pod]
  roots:
    - name: container_network_receive_bytes_total
      domain: network
      companions: [container_network_transmit_bytes_total]
    - name: container_network_receive_packets_dropped_total
      domain: network
      companions: [container_network_transmit_packets_dropped_total]
  children:
    container_network_receive_bytes_total:
      - container_network_receive_packets_total
      - container_network_transmit_packets_total
    container_network_receive_packets_dropped_total:
      - container_network_receive_errors_total
      - container_network_transmit_errors_total
      - container_network_tcp_usage_total
      - container_network_udp_usage_total
    container_network_tcp_usage_total:
      - container_network_tcp6_usage_total
      - container_network_advance_tcp_stats_total
    container_network_udp_usage_total: [container_network_udp6_usage_total]
  description: "Network counters belong to the pod network namespace and are reported on the pod/sandbox cgroup (container=\"\" or \"POD\"); aggregate by pod."
