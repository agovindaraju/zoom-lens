# Zoom-Lens metric tree packs. Validate with: go run ./tools/knowledge-gen validate knowledge
# Apply with:  kubectl apply -f deploy/crds/ && kubectl apply -k knowledge/
---
apiVersion: zoomlens.dev/v1alpha1
kind: MetricTreePack
metadata:
  name: kube-state-metrics-cluster
  labels:
    app.kubernetes.io/part-of: zoomlens
    app.kubernetes.io/version: "1.0.0"
    zoomlens.dev/source: kube-state-metrics
spec:
  source:
    name: kube-state-metrics
    component: "kubernetes/kube-state-metrics v2.20"
    job: kube-state-metrics
    endpoint: ":8080/metrics"
    scope: cluster
  entity: Cluster
  roots:
    - name: kube_node_status_allocatable
      domain: scheduling
      companions:
        - kube_pod_container_resource_requests
        - kube_node_status_capacity
        - kube_node_role
  children:
    kube_node_status_allocatable:
      - kube_pod_container_resource_limits
      - kube_pod_init_container_resource_requests
      - kube_pod_init_container_resource_limits
      - kube_pod_overhead_cpu_cores
      - kube_pod_overhead_memory_bytes
  description: "Capacity / overcommit view (KubeCPUOvercommit, KubeMemoryOvercommit, KubeletTooManyPods). Prefer kube-scheduler kube_pod_resource_request/limit when available (accounts for pod-level resources). KSM exposes every object from ONE endpoint, so it is scraped by a cluster-level collector and scoped by entity labels (metric_relabel keep on namespace/pod/...), not by node. Object-inventory metrics (*_annotations, *_metadata_resource_version, configmap/secret/serviceaccount/RBAC/admission-config info) are not signals and are left out of the trees; the entity graph uses some of them for discovery."
---
