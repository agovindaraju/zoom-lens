apiVersion: zoomlens.dev/v1alpha1
kind: MetricTreePack
metadata:
  name: kube-state-metrics-pod
  labels:
    app.kubernetes.io/part-of: zoomlens
    app.kubernetes.io/version: "1.0.0"
    zoomlens.dev/source: kube-state-metrics
spec:
  source:
    name: kube-state-metrics
    component: "kubernetes/kube-state-metrics v2.20"
    job: kube-state-metrics
    endpoint: ":8080/metrics"
    scope: cluster
  entity: Pod
  identityLabels: [namespace, pod]
  roots:
    - name: kube_pod_status_phase
      domain: lifecycle
    - name: kube_pod_status_ready
      domain: lifecycle
    - name: kube_pod_container_status_restarts_total
      domain: lifecycle
    - name: kube_pod_container_status_waiting_reason
      domain: lifecycle
  children:
    kube_pod_status_phase:
      - kube_pod_status_reason
      - kube_pod_status_scheduled
      - kube_pod_status_unschedulable
      - kube_pod_info
      - kube_pod_owner
      - kube_pod_start_time
      - kube_pod_deletion_timestamp
      - kube_pod_status_disruption_reason
    kube_pod_status_scheduled:
      - kube_pod_status_scheduled_time
      - kube_pod_status_unscheduled_time
      - kube_pod_tolerations
      - kube_pod_nodeselectors
      - kube_pod_scheduler
      - kube_pod_status_qos_class
    kube_pod_start_time:
      - kube_pod_created
      - kube_pod_completion_time
      - kube_pod_status_initialized_time
    kube_pod_info:
      - kube_pod_ips
      - kube_pod_labels
      - kube_pod_service_account
      - kube_pod_runtimeclass_name_info
      - kube_pod_restart_policy
      - kube_pod_spec_volumes_persistentvolumeclaims_info
      - kube_pod_resourceclaim_info
    kube_pod_spec_volumes_persistentvolumeclaims_info: [kube_pod_spec_volumes_persistentvolumeclaims_readonly]
    kube_pod_status_ready:
      - kube_pod_container_status_ready
      - kube_pod_status_ready_time
      - kube_pod_status_container_ready_time
    kube_pod_container_status_restarts_total:
      - kube_pod_container_status_last_terminated_reason
      - kube_pod_container_status_last_terminated_exitcode
      - kube_pod_container_status_last_terminated_timestamp
      - kube_pod_container_status_terminated
      - kube_pod_container_state_started
      - kube_pod_init_container_status_restarts_total
    kube_pod_container_status_terminated:
      - kube_pod_container_status_terminated_reason
      - kube_pod_container_status_running
    kube_pod_init_container_status_restarts_total:
      - kube_pod_init_container_status_last_terminated_reason
      - kube_pod_init_container_status_last_terminated_exitcode
      - kube_pod_init_container_status_last_terminated_timestamp
      - kube_pod_init_container_status_terminated
      - kube_pod_init_container_status_running
      - kube_pod_init_container_state_started
      - kube_pod_init_container_status_ready
    kube_pod_init_container_status_terminated: [kube_pod_init_container_status_terminated_reason]
    kube_pod_container_status_waiting_reason:
      - kube_pod_container_status_waiting
      - kube_pod_container_info
      - kube_pod_init_container_status_waiting
      - kube_pod_init_container_info
    kube_pod_init_container_status_waiting: [kube_pod_init_container_status_waiting_reason]
  description: "Pod and container metrics share this kind; container-level series carry the extra 'container' label. KSM pod metrics have no 'node' label: join kube_pod_info on (namespace, pod) to get it. KSM exposes every object from ONE endpoint, so it is scraped by a cluster-level collector and scoped by entity labels (metric_relabel keep on namespace/pod/...), not by node. Object-inventory metrics (*_annotations, *_metadata_resource_version, configmap/secret/serviceaccount/RBAC/admission-config info) are not signals and are left out of the trees; the entity graph uses some of them for discovery."
---
