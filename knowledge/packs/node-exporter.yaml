# Zoom-Lens metric tree packs. Validate with: go run ./hack/mkg validate knowledge
# Apply with:  kubectl apply -f deploy/crds/ && kubectl apply -k knowledge/
---
apiVersion: zoomlens.dev/v1alpha1
kind: MetricTreePack
metadata:
  name: node-exporter-node
  labels:
    app.kubernetes.io/part-of: zoomlens
    app.kubernetes.io/version: "1.0.0"
    zoomlens.dev/source: node-exporter
spec:
  source:
    name: node-exporter
    component: prometheus/node_exporter
    job: node-exporter
    endpoint: ":9100/metrics"
    scope: per-node
  entity: Node
  identityLabels: [node]
  roots:
    - name: node_cpu_seconds_total
      domain: cpu
    - name: node_load1
      domain: cpu
    - name: node_memory_MemAvailable_bytes
      domain: memory
      companions: [node_memory_MemTotal_bytes]
    - name: node_disk_io_time_seconds_total
      domain: storage
    - name: node_filesystem_avail_bytes
      domain: storage
      companions: [node_filesystem_size_bytes, node_filesystem_readonly]
    - name: node_filesystem_files_free
      domain: storage
      companions: [node_filesystem_files]
    - name: node_network_receive_bytes_total
      domain: network
      companions: [node_network_transmit_bytes_total, node_network_speed_bytes]
    - name: node_network_receive_errs_total
      domain: network
      companions:
        - node_network_transmit_errs_total
        - node_network_receive_packets_total
        - node_network_transmit_packets_total
    - name: node_nf_conntrack_entries
      domain: network
      companions: [node_nf_conntrack_entries_limit]
    - name: node_filefd_allocated
      domain: lifecycle
      companions: [node_filefd_maximum]
    - name: node_timex_offset_seconds
      domain: lifecycle
      companions: [node_timex_sync_status, node_timex_maxerror_seconds]
    - name: node_scrape_collector_success
      domain: lifecycle
    - name: node_systemd_unit_state
      domain: lifecycle
  children:
    node_cpu_seconds_total:
      - node_pressure_cpu_waiting_seconds_total
      - node_schedstat_waiting_seconds_total
      - node_procs_running
      - node_context_switches_total
      - node_intr_total
      - node_cpu_core_throttles_total
      - node_cpu_scaling_frequency_hertz
      - node_cpu_guest_seconds_total
    node_schedstat_waiting_seconds_total: [node_schedstat_running_seconds_total, node_schedstat_timeslices_total]
    node_procs_running: [node_forks_total]
    node_intr_total: [node_softirqs_total]
    node_cpu_core_throttles_total:
      - node_cpu_package_throttles_total
      - node_thermal_zone_temp
      - node_hwmon_temp_celsius
      - node_cooling_device_cur_state
    node_cooling_device_cur_state: [node_cooling_device_max_state]
    node_cpu_scaling_frequency_hertz:
      - node_cpu_frequency_hertz
      - node_cpu_frequency_max_hertz
      - node_cpu_scaling_governor
      - node_cpu_online
    node_load1: [node_load5, node_load15, node_kernel_hung_tasks_total]
    node_memory_MemAvailable_bytes:
      - node_pressure_memory_waiting_seconds_total
      - node_vmstat_pgmajfault
      - node_vmstat_oom_kill
      - node_memory_Cached_bytes
      - node_memory_SwapFree_bytes
      - node_memory_Committed_AS_bytes
      - node_memory_Slab_bytes
      - node_memory_Dirty_bytes
      - node_memory_HugePages_Free
      - node_memory_HardwareCorrupted_bytes
    node_pressure_memory_waiting_seconds_total: [node_pressure_memory_stalled_seconds_total]
    node_vmstat_pgmajfault: [node_vmstat_pgfault, node_vmstat_pgpgin, node_vmstat_pgpgout]
    node_memory_Cached_bytes:
      - node_memory_MemFree_bytes
      - node_memory_Buffers_bytes
      - node_memory_Active_file_bytes
      - node_memory_Inactive_file_bytes
      - node_memory_Shmem_bytes
      - node_memory_Mapped_bytes
    node_memory_SwapFree_bytes:
      - node_memory_SwapTotal_bytes
      - node_memory_SwapCached_bytes
      - node_vmstat_pswpin
      - node_vmstat_pswpout
    node_memory_Committed_AS_bytes:
      - node_memory_CommitLimit_bytes
      - node_memory_AnonPages_bytes
      - node_memory_AnonHugePages_bytes
    node_memory_Slab_bytes:
      - node_memory_SReclaimable_bytes
      - node_memory_SUnreclaim_bytes
      - node_memory_KernelStack_bytes
      - node_memory_PageTables_bytes
      - node_memory_VmallocUsed_bytes
    node_memory_Dirty_bytes: [node_memory_Writeback_bytes, node_memory_WritebackTmp_bytes]
    node_memory_HugePages_Free:
      - node_memory_HugePages_Total
      - node_memory_HugePages_Rsvd
      - node_memory_HugePages_Surp
    node_memory_HardwareCorrupted_bytes:
      - node_edac_uncorrectable_errors_total
      - node_edac_correctable_errors_total
    node_edac_uncorrectable_errors_total:
      - node_edac_csrow_uncorrectable_errors_total
      - node_edac_channel_uncorrectable_errors_total
    node_edac_correctable_errors_total:
      - node_edac_csrow_correctable_errors_total
      - node_edac_channel_correctable_errors_total
    node_disk_io_time_seconds_total:
      - node_pressure_io_waiting_seconds_total
      - node_disk_io_time_weighted_seconds_total
      - node_disk_read_time_seconds_total
      - node_disk_write_time_seconds_total
      - node_disk_read_bytes_total
      - node_disk_written_bytes_total
      - node_disk_io_now
      - node_md_disks
      - node_disk_info
      - node_nfs_rpc_retransmissions_total
    node_pressure_io_waiting_seconds_total: [node_pressure_io_stalled_seconds_total, node_procs_blocked]
    node_disk_read_time_seconds_total: [node_disk_reads_completed_total, node_disk_reads_merged_total]
    node_disk_write_time_seconds_total:
      - node_disk_writes_completed_total
      - node_disk_writes_merged_total
      - node_disk_flush_requests_total
      - node_disk_discard_time_seconds_total
      - node_xfs_write_calls_total
    node_disk_flush_requests_total: [node_disk_flush_requests_time_seconds_total]
    node_disk_discard_time_seconds_total:
      - node_disk_discards_completed_total
      - node_disk_discards_merged_total
      - node_disk_discarded_sectors_total
    node_xfs_write_calls_total:
      - node_xfs_read_calls_total
      - node_xfs_block_mapping_writes_total
      - node_xfs_block_mapping_reads_total
    node_md_disks:
      - node_md_disks_required
      - node_md_state
      - node_md_degraded
      - node_md_blocks_synced
      - node_md_blocks
    node_disk_info: [node_disk_device_mapper_info, node_disk_filesystem_info]
    node_nfs_rpc_retransmissions_total: [node_nfs_rpcs_total, node_nfs_requests_total, node_nfs_connections_total]
    node_filesystem_avail_bytes:
      - node_filesystem_free_bytes
      - node_filesystem_device_error
      - node_filesystem_mount_info
    node_network_receive_bytes_total:
      - node_network_up
      - node_network_carrier_changes_total
      - node_network_mtu_bytes
      - node_network_transmit_queue_length
      - node_network_receive_multicast_total
      - node_netstat_IpExt_InOctets
      - node_arp_entries
    node_network_carrier_changes_total:
      - node_network_carrier_up_changes_total
      - node_network_carrier_down_changes_total
      - node_network_carrier
      - node_bonding_active
    node_bonding_active: [node_bonding_slaves]
    node_netstat_IpExt_InOctets:
      - node_netstat_IpExt_OutOctets
      - node_netstat_Ip6_InOctets
      - node_netstat_Ip6_OutOctets
    node_network_receive_errs_total:
      - node_network_receive_drop_total
      - node_network_transmit_drop_total
      - node_network_receive_fifo_total
      - node_network_receive_frame_total
      - node_network_transmit_carrier_total
      - node_network_transmit_colls_total
      - node_network_receive_nohandler_total
      - node_softnet_dropped_total
      - node_netstat_Tcp_RetransSegs
      - node_netstat_Udp_InErrors
      - node_netstat_Icmp_InErrors
    node_network_receive_drop_total:
      - node_ethtool_received_dropped_total
      - node_ethtool_received_errors_total
      - node_ethtool_transmitted_errors_total
    node_network_receive_fifo_total: [node_network_transmit_fifo_total]
    node_softnet_dropped_total:
      - node_softnet_times_squeezed_total
      - node_softnet_processed_total
      - node_softnet_backlog_len
      - node_softnet_received_rps_total
      - node_softnet_flow_limit_count_total
      - node_softnet_cpu_collision_total
    node_netstat_Tcp_RetransSegs:
      - node_netstat_Tcp_OutSegs
      - node_netstat_TcpExt_TCPSynRetrans
      - node_netstat_TcpExt_TCPTimeouts
      - node_netstat_Tcp_InErrs
      - node_netstat_Tcp_OutRsts
      - node_netstat_TcpExt_ListenOverflows
      - node_netstat_TcpExt_TCPRcvQDrop
      - node_netstat_TcpExt_TCPOFOQueue
      - node_netstat_Tcp_CurrEstab
    node_netstat_TcpExt_ListenOverflows:
      - node_netstat_TcpExt_ListenDrops
      - node_netstat_TcpExt_SyncookiesSent
      - node_netstat_TcpExt_SyncookiesRecv
      - node_netstat_TcpExt_SyncookiesFailed
    node_netstat_Tcp_OutSegs:
      - node_netstat_Tcp_InSegs
      - node_netstat_Tcp_ActiveOpens
      - node_netstat_Tcp_PassiveOpens
    node_netstat_Tcp_CurrEstab:
      - node_sockstat_sockets_used
      - node_sockstat_TCP_inuse
      - node_sockstat_TCP_tw
      - node_sockstat_TCP_orphan
      - node_sockstat_TCP_alloc
      - node_sockstat_TCP_mem_bytes
    node_netstat_Udp_InErrors:
      - node_netstat_Udp_RcvbufErrors
      - node_netstat_Udp_SndbufErrors
      - node_netstat_Udp_NoPorts
      - node_netstat_Udp_InDatagrams
      - node_netstat_Udp_OutDatagrams
      - node_udp_queues
      - node_sockstat_UDP_inuse
    node_netstat_Icmp_InErrors:
      - node_netstat_Icmp_InMsgs
      - node_netstat_Icmp_OutMsgs
      - node_netstat_Icmp6_InErrors
    node_nf_conntrack_entries:
      - node_nf_conntrack_stat_drop
      - node_nf_conntrack_stat_invalid
      - node_nf_conntrack_stat_insert
    node_nf_conntrack_stat_drop: [node_nf_conntrack_stat_insert_failed, node_nf_conntrack_stat_early_drop]
    node_nf_conntrack_stat_invalid: [node_nf_conntrack_stat_ignore, node_nf_conntrack_stat_search_restart]
    node_nf_conntrack_stat_insert: [node_nf_conntrack_stat_found]
    node_filefd_allocated: [node_processes_pids, node_processes_threads, node_processes_state]
    node_processes_pids: [node_processes_max_processes]
    node_processes_threads: [node_processes_max_threads, node_processes_threads_state]
    node_timex_offset_seconds:
      - node_timex_estimated_error_seconds
      - node_timex_frequency_adjustment_ratio
      - node_timex_status
      - node_timex_tai_offset_seconds
      - node_timex_loop_time_constant
      - node_time_seconds
    node_scrape_collector_success:
      - node_scrape_collector_duration_seconds
      - node_boot_time_seconds
      - node_textfile_scrape_error
      - node_uname_info
      - node_os_info
    node_textfile_scrape_error: [node_textfile_mtime_seconds]
    node_systemd_unit_state:
      - node_systemd_service_restart_total
      - node_systemd_units
      - node_systemd_system_running
      - node_systemd_unit_start_time_seconds
      - node_systemd_unit_tasks_current
      - node_systemd_socket_refused_connections_total
    node_systemd_unit_tasks_current: [node_systemd_unit_tasks_max]
    node_systemd_socket_refused_connections_total:
      - node_systemd_socket_accepted_connections_total
      - node_systemd_socket_current_connections
  description: "node_systemd_* needs --collector.systemd; node_processes_* needs --collector.processes; node_ethtool_* needs --collector.ethtool. Absent series are simply not collected."
