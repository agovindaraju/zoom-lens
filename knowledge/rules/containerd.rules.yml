# Zoom-Lens root alerts for containerd (optional add-on: load only if it is deployed).
# Standard Prometheus rule file. Load via prometheus.yml rule_files; check with: promtool check rules <file>
# Labels: zoomlens_root = the root metric to expand, zoomlens_source = its MetricTreePack source,
# zoomlens_entity = operator entity kind. Keep the identity labels in the by (...) clause.
groups:
  - name: zoomlens.containerd
    interval: 30s
    rules:
      - alert: ZLContainerdPodNetworkSetupSlow
        expr: |-
          (histogram_quantile(0.99, sum by (node, le) (rate(containerd_cri_sandbox_create_network_seconds_bucket[5m])))) > 10
        for: 10m
        labels:
          severity: warning
          zoomlens_source: containerd
          zoomlens_root: containerd_cri_sandbox_create_network_seconds
          zoomlens_entity: Node
        annotations:
          summary: "pod network setup p99 on {{ $labels.node }} is {{ $value }}s"
          description: "Source: operational (metric name UNVERIFIED)."
